name: Release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  verify:
    name: Verify release
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish GitHub release with build provenance
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.0"
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --locked --no-dev --group quality
      - name: Verify source and version
        shell: bash
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          uv run --frozen --no-dev --group quality python - <<'PY'
          from importlib.metadata import version
          import os
          assert os.environ["GITHUB_REF_NAME"] == "v" + version("quantchapter-returns-lab"), "Tag must match package version"
          PY
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - run: uv build --no-build-isolation
      - run: uv run --frozen --no-dev --group quality python -m twine check --strict dist/*
      - name: Record artifact digests
        shell: bash
        run: |
          uv run --frozen --no-dev --group quality python - <<'PY'
          import hashlib
          from pathlib import Path
          directory = Path("dist")
          artifacts = sorted(list(directory.glob("*.whl")) + list(directory.glob("*.tar.gz")))
          assert len(artifacts) == 2, "Expected wheel and source archive"
          digest_lines = [f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n" for path in artifacts]
          (directory / "SHA256SUMS").write_text("".join(digest_lines), encoding="utf-8", newline="\n")
          PY
      - name: Attest built distributions
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Returns Lab $GITHUB_REF_NAME" \
            --notes-file .github/RELEASE_NOTES.md \
            dist/*
