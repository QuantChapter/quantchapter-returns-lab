[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "quantchapter-returns-lab"
version = "0.1.0"
description = "Reproducible return and risk calculations, with worked Python examples from QuantChapter."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "QuantChapter" }]
keywords = ["education", "python", "returns", "volatility", "drawdown", "quantitative-finance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/QuantChapter/quantchapter-returns-lab"
Documentation = "https://github.com/QuantChapter/quantchapter-returns-lab/tree/main/docs"
Repository = "https://github.com/QuantChapter/quantchapter-returns-lab"
Issues = "https://github.com/QuantChapter/quantchapter-returns-lab/issues"
Changelog = "https://github.com/QuantChapter/quantchapter-returns-lab/blob/main/CHANGELOG.md"

[project.scripts]
quantchapter-returns = "quantchapter_returns.cli:main"

[project.optional-dependencies]
plot = ["matplotlib>=3.9,<4", "pillow>=13,<14"]
notebooks = [
  "ipykernel>=6.29,<8",
  "matplotlib>=3.9,<4",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "pillow>=13,<14",
  "tornado>=6.6,<7",
]

[dependency-groups]
test = ["hypothesis>=6.125,<7", "pytest>=8.3,<10", "pytest-cov>=6,<8"]
quality = [
  "build>=1.2,<2",
  "hatchling>=1.27,<2",
  "filelock>=4.2.1,<5",
  "mypy>=1.15,<3",
  "pip-audit>=2.8,<3",
  "ruff>=0.11,<1",
  "twine>=7,<8",
]
notebook = [
  "ipykernel>=6.29,<8",
  "matplotlib>=3.9,<4",
  "nbconvert>=7.16,<8",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "pillow>=13,<14",
  "tornado>=6.6,<7",
]
dev = [
  { include-group = "test" },
  { include-group = "quality" },
  { include-group = "notebook" },
]

[tool.hatch.build.targets.wheel]
packages = ["src/quantchapter_returns"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/tools",
  "/examples",
  "/notebooks",
  "/data",
  "/docs",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers --cov=quantchapter_returns --cov-branch --cov-report=term-missing:skip-covered --cov-fail-under=95"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["quantchapter_returns"]

[tool.coverage.report]
show_missing = true
precision = 2
exclude_also = ['if __name__ == ["\x27]__main__["\x27]:']

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true
